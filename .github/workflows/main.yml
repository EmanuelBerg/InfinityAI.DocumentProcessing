on: [push]

name: publish

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/Nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Add GitHub NuGet source
        run: |
          dotnet nuget add source --username emanuelberg --password "${{ secrets.NUGET_APIKEY }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/emanuelberg/index.json"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output "${{ env.NuGetDirectory }}"

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*.nupkg

  deploy:
    runs-on: ubuntu-latest
    needs: [create_nuget]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Add GitHub NuGet source
        run: |
          dotnet nuget add source --username emanuelberg --password "${{ secrets.NUGET_APIKEY }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/emanuelberg/index.json"

      - name: Publish NuGet package
        run: dotnet nuget push "${{ env.NuGetDirectory }}/*.nupkg" --api-key "${{ secrets.NUGET_APIKEY }}" --source "github" --skip-duplicate
